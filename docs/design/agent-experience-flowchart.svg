<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset=".6" stop-color="#102442"/><stop offset="1" stop-color="#211936"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#9bc2ff"/></marker>
    <marker id="arrowWarm" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#f0b578"/></marker>
    <style>
      .cn { font-family: PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif; }
      .title { font-size: 42px; font-weight:700; fill:#f7f9ff; }
      .subtitle { font-size:18px; fill:#b5c3d9; }
      .lane { font-size:15px; font-weight:700; fill:#9cc4ff; letter-spacing:2px; }
      .boxTitle { font-size:19px; font-weight:700; fill:#f7f9ff; }
      .boxText { font-size:14px; fill:#d9e4f3; }
      .small { font-size:13px; fill:#aabbd1; }
      .decision { font-size:16px; font-weight:700; fill:#fff6e9; }
      .yesno { font-size:13px; font-weight:700; fill:#f0b578; }
    </style>
  </defs>

  <rect width="1800" height="1420" fill="url(#bg)"/>
  <circle cx="1650" cy="100" r="250" fill="#5876d7" opacity=".10"/>
  <circle cx="80" cy="1300" r="280" fill="#c77966" opacity=".08"/>

  <text x="80" y="70" class="cn title">如果｜Agent 工作流程图</text>
  <text x="80" y="106" class="cn subtitle">一次输入如何变成资料、分支、角色回应，以及下一次相遇的变化</text>
  <rect x="80" y="132" width="1640" height="60" rx="18" fill="#142843" stroke="#31547f"/>
  <text x="110" y="170" class="cn boxText">核心原则：个人向导认识现实中的你；世界导演让平行世界运转；NPC 角色负责和你生活在一起。</text>

  <!-- swimlanes -->
  <rect x="80" y="235" width="300" height="1080" rx="22" fill="#0c1b30" stroke="#2c4d77"/>
  <rect x="400" y="235" width="420" height="1080" rx="22" fill="#0d2038" stroke="#365f91"/>
  <rect x="840" y="235" width="420" height="1080" rx="22" fill="#191a36" stroke="#705184"/>
  <rect x="1280" y="235" width="440" height="1080" rx="22" fill="#15172f" stroke="#5b4c86"/>
  <text x="110" y="275" class="cn lane">用户</text>
  <text x="430" y="275" class="cn lane">个人向导 AGENT</text>
  <text x="870" y="275" class="cn lane">分支与世界</text>
  <text x="1310" y="275" class="cn lane">世界导演 + NPC</text>

  <!-- user lane -->
  <rect x="120" y="320" width="220" height="76" rx="16" fill="#19365c" stroke="#5988c6" filter="url(#shadow)"/>
  <text x="230" y="351" text-anchor="middle" class="cn boxTitle">进入“如果”</text>
  <text x="230" y="378" text-anchor="middle" class="cn small">开始聊天或打开已有分支</text>
  <path d="M230 396 V438" stroke="#9bc2ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="120" y="458" width="220" height="92" rx="16" fill="#19365c" stroke="#5988c6"/>
  <text x="230" y="492" text-anchor="middle" class="cn boxTitle">输入一句话</text>
  <text x="230" y="520" text-anchor="middle" class="cn boxText">经历、烦恼、愿望或选择</text>
  <path d="M340 504 H430" stroke="#9bc2ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="386" y="486" text-anchor="middle" class="cn small">发送</text>

  <!-- personal guide lane -->
  <rect x="440" y="320" width="340" height="92" rx="16" fill="#1b4675" stroke="#69a4ee" filter="url(#shadow)"/>
  <text x="610" y="354" text-anchor="middle" class="cn boxTitle">理解你的话</text>
  <text x="610" y="383" text-anchor="middle" class="cn boxText">识别情绪、经历和真正想探索的事</text>
  <path d="M610 412 V452" stroke="#9bc2ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polygon points="610,454 728,520 610,586 492,520" fill="#573b50" stroke="#d29772" filter="url(#shadow)"/>
  <text x="610" y="515" text-anchor="middle" class="cn decision">这句话有新的信息吗？</text>
  <text x="610" y="540" text-anchor="middle" class="cn small">经历 / 兴趣 / 愿望 / 重要的人</text>
  <path d="M492 520 H420 V680 H440" fill="none" stroke="#f0b578" stroke-width="2.5" marker-end="url(#arrowWarm)"/>
  <text x="450" y="504" class="cn yesno">是</text>
  <rect x="440" y="680" width="340" height="94" rx="16" fill="#1a416c" stroke="#5d94d8"/>
  <text x="610" y="715" text-anchor="middle" class="cn boxTitle">更新“我的”资料</text>
  <text x="610" y="744" text-anchor="middle" class="cn boxText">让下一次对话记得你说过的事</text>
  <path d="M780 727 H815 V320 H780" fill="none" stroke="#6e9de2" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="792" y="650" class="cn small" transform="rotate(-90 792 650)">继续聊天</text>
  <path d="M728 520 H800 V875 H780" fill="none" stroke="#9bc2ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="742" y="505" class="cn yesno">否 / 继续</text>
  <rect x="440" y="850" width="340" height="92" rx="16" fill="#1b4675" stroke="#69a4ee"/>
  <text x="610" y="884" text-anchor="middle" class="cn boxTitle">判断是否出现“如果”</text>
  <text x="610" y="913" text-anchor="middle" class="cn boxText">用户想试试另一种人生吗？</text>
  <path d="M780 896 H870" stroke="#f0b578" stroke-width="2.5" marker-end="url(#arrowWarm)"/>
  <text x="824" y="876" class="cn yesno">是</text>
  <path d="M610 942 V1010" stroke="#9bc2ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="440" y="1028" width="340" height="92" rx="16" fill="#1b4675" stroke="#69a4ee"/>
  <text x="610" y="1062" text-anchor="middle" class="cn boxTitle">继续认识你</text>
  <text x="610" y="1091" text-anchor="middle" class="cn boxText">没有分支也可以一直聊天</text>
  <path d="M440 1074 H390 V504 H340" fill="none" stroke="#6e9de2" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>

  <!-- world lane -->
  <rect x="880" y="320" width="340" height="92" rx="16" fill="#34254d" stroke="#a36ec0" filter="url(#shadow)"/>
  <text x="1050" y="354" text-anchor="middle" class="cn boxTitle">生成或选择分支</text>
  <text x="1050" y="383" text-anchor="middle" class="cn boxText">例如：如果我成为导演</text>
  <path d="M1050 412 V452" stroke="#f0b578" stroke-width="2.5" marker-end="url(#arrowWarm)"/>
  <rect x="880" y="472" width="340" height="106" rx="16" fill="#34254d" stroke="#a36ec0"/>
  <text x="1050" y="508" text-anchor="middle" class="cn boxTitle">建立这个世界</text>
  <text x="1050" y="537" text-anchor="middle" class="cn boxText">身份 · 人物 · 关系 · 开场事件</text>
  <text x="1050" y="562" text-anchor="middle" class="cn small">带入与你有关的资料，但不是全部隐私</text>
  <path d="M1050 578 V620" stroke="#f0b578" stroke-width="2.5" marker-end="url(#arrowWarm)"/>
  <rect x="880" y="640" width="340" height="100" rx="16" fill="#34254d" stroke="#a36ec0"/>
  <text x="1050" y="676" text-anchor="middle" class="cn boxTitle">进入平行世界手机</text>
  <text x="1050" y="705" text-anchor="middle" class="cn boxText">锁屏上可能已有新消息</text>
  <path d="M1220 690 H1310" stroke="#f0b578" stroke-width="2.5" marker-end="url(#arrowWarm)"/>
  <text x="1263" y="670" class="cn yesno">进入</text>
  <rect x="880" y="812" width="340" height="120" rx="16" fill="#261f43" stroke="#875fae"/>
  <text x="1050" y="848" text-anchor="middle" class="cn boxTitle">分支记忆</text>
  <text x="1050" y="878" text-anchor="middle" class="cn boxText">这个世界记住你的选择</text>
  <text x="1050" y="905" text-anchor="middle" class="cn small">不改写现实资料，可回看、修正或忘掉</text>
  <path d="M1050 740 V812" stroke="#9bc2ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1070" y="782" class="cn small">持续变化</text>

  <!-- director + NPC lane -->
  <rect x="1320" y="320" width="360" height="92" rx="16" fill="#4a2d3c" stroke="#d18b69" filter="url(#shadow)"/>
  <text x="1500" y="354" text-anchor="middle" class="cn boxTitle">世界导演 Agent</text>
  <text x="1500" y="383" text-anchor="middle" class="cn boxText">读取场景、时间、关系和分支记忆</text>
  <path d="M1500 412 V452" stroke="#f0b578" stroke-width="2.5" marker-end="url(#arrowWarm)"/>
  <rect x="1320" y="472" width="360" height="112" rx="16" fill="#38284b" stroke="#9c70d4"/>
  <text x="1500" y="508" text-anchor="middle" class="cn boxTitle">选择这次由谁回应</text>
  <text x="1500" y="538" text-anchor="middle" class="cn boxText">根据当前场景安排合适的 NPC</text>
  <text x="1500" y="565" text-anchor="middle" class="cn small">不是所有人同时出现，只保留关键人物</text>
  <path d="M1500 584 V624" stroke="#9bc2ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1320" y="644" width="360" height="112" rx="16" fill="#38284b" stroke="#9c70d4"/>
  <text x="1500" y="680" text-anchor="middle" class="cn boxTitle">NPC 角色 Agent</text>
  <text x="1500" y="710" text-anchor="middle" class="cn boxText">按自己的性格、目标和记忆说话</text>
  <text x="1500" y="737" text-anchor="middle" class="cn small">只代表自己，不替别人发言</text>
  <path d="M1500 756 V798" stroke="#9bc2ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1320" y="818" width="360" height="112" rx="16" fill="#38284b" stroke="#9c70d4"/>
  <text x="1500" y="854" text-anchor="middle" class="cn boxTitle">回应用户并产生行动</text>
  <text x="1500" y="884" text-anchor="middle" class="cn boxText">消息、邀约、照片、日历事件</text>
  <text x="1500" y="911" text-anchor="middle" class="cn small">用户看到的是手机里的真实反馈</text>
  <path d="M1320 874 H1260 V872 H1220" fill="none" stroke="#f0b578" stroke-width="2.5" marker-end="url(#arrowWarm)"/>
  <text x="1274" y="852" class="cn small">写入分支记忆</text>
  <path d="M1500 930 V1000" stroke="#9bc2ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polygon points="1500,1002 1612,1066 1500,1130 1388,1066" fill="#573b50" stroke="#d29772" filter="url(#shadow)"/>
  <text x="1500" y="1060" text-anchor="middle" class="cn decision">这次选择改变了什么？</text>
  <text x="1500" y="1085" text-anchor="middle" class="cn small">有事件 / 关系变化吗？</text>
  <path d="M1388 1066 H1270 V1188 H1220" fill="none" stroke="#9bc2ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1310" y="1050" class="cn yesno">是</text>
  <rect x="1320" y="1180" width="360" height="80" rx="16" fill="#302344" stroke="#8c66bb"/>
  <text x="1500" y="1213" text-anchor="middle" class="cn boxTitle">下一次相遇会不同</text>
  <text x="1500" y="1239" text-anchor="middle" class="cn small">回到手机，继续生活</text>
  <path d="M1680 1220 H1740 V320 H1680" fill="none" stroke="#6e9de2" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="1756" y="780" class="cn small" transform="rotate(90 1756 780)">循环运行</text>

  <!-- bottom explanation -->
  <rect x="80" y="1340" width="1640" height="44" rx="14" fill="#0b172b" stroke="#2d4b73"/>
  <text x="110" y="1368" class="cn small">两个核心层级：个人向导 Agent（认识你）｜世界导演 Agent + 多个 NPC Agent（让世界和人物回应你）｜资料与记忆负责承接结果。</text>
</svg>
