<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0c1c34"/>
      <stop offset="1" stop-color="#10162b"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d7cf6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8c6cff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="ready" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8f80" stop-opacity=".32"/>
      <stop offset="1" stop-color="#123d4a" stop-opacity=".46"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a96a28" stop-opacity=".45"/>
      <stop offset="1" stop-color="#422b29" stop-opacity=".65"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#83aeea"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#65d6bd"/>
    </marker>
    <style>
      .cn { font-family: PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, monospace; }
      .title { font-size: 40px; font-weight: 700; fill: #f4f7ff; letter-spacing: 1px; }
      .subtitle { font-size: 18px; fill: #a9b9d2; }
      .section { font-size: 16px; font-weight: 700; fill: #92b9ee; letter-spacing: 2px; }
      .cardTitle { font-size: 21px; font-weight: 700; fill: #f4f7ff; }
      .cardSub { font-size: 14px; fill: #a7bad6; }
      .body { font-size: 15px; fill: #d5dfef; }
      .small { font-size: 13px; fill: #9fb0c9; }
      .tiny { font-size: 12px; fill: #90a3be; }
      .pill { font-size: 13px; font-weight: 700; }
      .flow { font-size: 15px; font-weight: 700; fill: #dce8ff; }
    </style>
  </defs>

  <rect width="1800" height="1260" fill="url(#bg)"/>
  <circle cx="1530" cy="90" r="220" fill="#314d91" opacity=".10"/>
  <circle cx="160" cy="1130" r="260" fill="#3b7b8d" opacity=".08"/>

  <text x="70" y="70" class="cn title">如果 · Parallel Life</text>
  <text x="70" y="103" class="cn subtitle">后端 Agent 与平行世界运行流程｜从真实对话，到可持续的另一种人生</text>
  <rect x="70" y="130" width="1660" height="92" rx="22" fill="url(#hero)" stroke="#335680"/>
  <text x="105" y="165" class="cn section">一次完整体验</text>
  <text x="105" y="202" class="cn flow">访谈</text>
  <path d="M180 193 H285" stroke="#83aeea" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="202" class="cn flow">资料沉淀</text>
  <path d="M430 193 H535" stroke="#83aeea" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="202" class="cn flow">选择“如果”</text>
  <path d="M710 193 H815" stroke="#83aeea" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="845" y="202" class="cn flow">创建世界</text>
  <path d="M960 193 H1065" stroke="#83aeea" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1095" y="202" class="cn flow">手机开机</text>
  <path d="M1205 193 H1310" stroke="#83aeea" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1340" y="202" class="cn flow">NPC 对话</text>
  <path d="M1450 193 H1555" stroke="#65d6bd" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1585" y="202" class="cn flow" fill="#65d6bd">记忆与后果</text>

  <text x="70" y="272" class="cn section">01 · 入口与安全边界</text>
  <rect x="70" y="292" width="1660" height="118" rx="18" fill="#101f37" stroke="#28466e" filter="url(#shadow)"/>
  <rect x="95" y="316" width="240" height="70" rx="14" fill="#182d4b" stroke="#3a6297"/>
  <text x="120" y="346" class="cn cardTitle">用户</text>
  <text x="120" y="372" class="cn cardSub">聊天｜分支｜平行手机</text>
  <path d="M345 351 H420" stroke="#83aeea" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="316" width="450" height="70" rx="14" fill="#172a48" stroke="#3a6297"/>
  <text x="465" y="345" class="cn cardTitle">Next.js 服务端入口</text>
  <text x="465" y="372" class="cn cardSub">Session · 鉴权 · 限流 · 版本 · 幂等</text>
  <path d="M900 351 H975" stroke="#83aeea" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="995" y="316" width="700" height="70" rx="14" fill="#172a48" stroke="#3a6297"/>
  <text x="1020" y="345" class="cn cardTitle">模块化单体 · 25 个迁移</text>
  <text x="1020" y="372" class="cn cardSub">domain 不依赖框架｜application 面向端口｜server 统一组装</text>

  <text x="70" y="463" class="cn section">02 · Agent 协作层</text>
  <rect x="70" y="483" width="1660" height="286" rx="20" fill="#0d1b30" stroke="#263f63"/>

  <rect x="95" y="515" width="250" height="108" rx="16" fill="url(#ready)" stroke="#2b8b80"/>
  <text x="118" y="548" class="cn cardTitle">个人向导</text>
  <text x="118" y="574" class="cn cardSub">InterviewPlanner</text>
  <text x="118" y="600" class="cn small">听你说 · 提问 · 提取事实</text>
  <text x="313" y="540" class="cn pill" fill="#65d6bd">✓ 就绪</text>

  <rect x="370" y="515" width="250" height="108" rx="16" fill="url(#ready)" stroke="#2b8b80"/>
  <text x="393" y="548" class="cn cardTitle">人生探索</text>
  <text x="393" y="574" class="cn cardSub">DiscoveryPlanner</text>
  <text x="393" y="600" class="cn small">从资料提出多个“如果”</text>
  <text x="588" y="540" class="cn pill" fill="#65d6bd">✓ 就绪</text>

  <rect x="645" y="515" width="250" height="108" rx="16" fill="url(#ready)" stroke="#2b8b80"/>
  <text x="668" y="548" class="cn cardTitle">世界创建</text>
  <text x="668" y="574" class="cn cardSub">WorldPlanner</text>
  <text x="668" y="600" class="cn small">身份 · 关系 · 开场 · 基线</text>
  <text x="863" y="540" class="cn pill" fill="#65d6bd">✓ 就绪</text>

  <rect x="920" y="515" width="250" height="108" rx="16" fill="url(#ready)" stroke="#2b8b80"/>
  <text x="943" y="548" class="cn cardTitle">NPC 角色</text>
  <text x="943" y="574" class="cn cardSub">WorldTurnPlanner</text>
  <text x="943" y="600" class="cn small">只代表自己 · 产生行动</text>
  <text x="1138" y="540" class="cn pill" fill="#65d6bd">✓ 就绪</text>

  <rect x="1195" y="515" width="250" height="108" rx="16" fill="url(#ready)" stroke="#2b8b80"/>
  <text x="1218" y="548" class="cn cardTitle">记忆服务</text>
  <text x="1218" y="574" class="cn cardSub">共享写入器 · 0 次额外调用</text>
  <text x="1218" y="600" class="cn small">来源 · 作用域 · 合并 · 遗忘</text>
  <text x="1413" y="540" class="cn pill" fill="#65d6bd">✓ 就绪</text>

  <rect x="1470" y="515" width="235" height="108" rx="16" fill="url(#warn)" stroke="#a86e32"/>
  <text x="1493" y="548" class="cn cardTitle">导演 + 时钟</text>
  <text x="1493" y="574" class="cn cardSub">beats · agenda · world_clock</text>
  <text x="1493" y="600" class="cn small">节奏 · 出场 · 时间推进</text>
  <text x="1674" y="540" text-anchor="end" class="cn pill" fill="#f6b66e">⚠ 缺口</text>

  <path d="M220 635 V692 H1580 V635" fill="none" stroke="#5479a9" stroke-width="2" stroke-dasharray="6 7"/>
  <text x="900" y="716" text-anchor="middle" class="cn small">每次 AI 只提出提案，运行时校验后才允许进入事务</text>

  <text x="70" y="824" class="cn section">03 · 执行与一致性</text>
  <rect x="70" y="844" width="1660" height="130" rx="20" fill="#101f37" stroke="#28466e"/>
  <rect x="95" y="870" width="350" height="76" rx="14" fill="#172a48" stroke="#3a6297"/>
  <text x="120" y="900" class="cn cardTitle">生产：同步执行</text>
  <text x="120" y="927" class="cn cardSub">POST /tasks/:id/run · runOwnedTask · runOne</text>
  <rect x="475" y="870" width="350" height="76" rx="14" fill="#172a48" stroke="#3a6297"/>
  <text x="500" y="900" class="cn cardTitle">备用：常驻 Worker</text>
  <text x="500" y="927" class="cn cardSub">run-loop · 租约 · SIGTERM 有界收尾</text>
  <rect x="855" y="870" width="350" height="76" rx="14" fill="#172a48" stroke="#3a6297"/>
  <text x="880" y="900" class="cn cardTitle">任务与副作用</text>
  <text x="880" y="927" class="cn cardSub">commands · tasks · outbox_jobs</text>
  <rect x="1235" y="870" width="470" height="76" rx="14" fill="#172a48" stroke="#3a6297"/>
  <text x="1260" y="900" class="cn cardTitle">运行时护栏</text>
  <text x="1260" y="927" class="cn cardSub">owner · 乐观锁 · 幂等回执 · unknown 不重付</text>

  <path d="M900 769 V842" stroke="#83aeea" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M650 946 V1010" stroke="#83aeea" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1050 946 V1010" stroke="#83aeea" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1450 946 V1010" stroke="#83aeea" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="70" y="1022" class="cn section">04 · 事实来源与手机投影</text>
  <rect x="70" y="1042" width="1660" height="154" rx="20" fill="#0d1b30" stroke="#263f63"/>
  <rect x="95" y="1065" width="475" height="108" rx="16" fill="#172a48" stroke="#3a6297"/>
  <text x="120" y="1096" class="cn cardTitle">Supabase PostgreSQL</text>
  <text x="120" y="1124" class="cn small">world_events · world_messages · appointments</text>
  <text x="120" y="1148" class="cn small">world_notes · world_facts · worlds.state</text>
  <text x="120" y="1172" class="cn small">world_initial_snapshots · commands · tasks</text>

  <rect x="600" y="1065" width="475" height="108" rx="16" fill="#172a48" stroke="#3a6297"/>
  <text x="625" y="1096" class="cn cardTitle">记忆与用户资料</text>
  <text x="625" y="1124" class="cn small">memory_records · source_refs · candidates</text>
  <text x="625" y="1148" class="cn small">profile 事实与事件 · character 印象</text>
  <text x="625" y="1172" class="cn small">branch episode · 可纠正 · 可遗忘 · 可追溯</text>

  <rect x="1105" y="1065" width="330" height="108" rx="16" fill="#172a48" stroke="#3a6297"/>
  <text x="1130" y="1096" class="cn cardTitle">手机读取</text>
  <text x="1130" y="1124" class="cn small">消息 · 日历 · 相册 · 便签</text>
  <text x="1130" y="1148" class="cn small">全部来自同一批投影</text>
  <text x="1130" y="1172" class="cn small">刷新即可恢复</text>

  <rect x="1465" y="1065" width="240" height="108" rx="16" fill="url(#warn)" stroke="#a86e32"/>
  <text x="1490" y="1096" class="cn cardTitle">媒体</text>
  <text x="1490" y="1124" class="cn small">索图 → outbox → media</text>
  <text x="1490" y="1148" class="cn small">适配器未接入时</text>
  <text x="1490" y="1172" class="cn small" fill="#f6b66e">如实失败，不造假图</text>

  <rect x="70" y="1210" width="1660" height="32" rx="10" fill="#081323"/>
  <circle cx="95" cy="1226" r="6" fill="#65d6bd"/><text x="110" y="1231" class="cn tiny">已就绪</text>
  <circle cx="220" cy="1226" r="6" fill="#f6b66e"/><text x="235" y="1231" class="cn tiny">进行中 / 需补齐</text>
  <circle cx="400" cy="1226" r="6" fill="#a86e32"/><text x="415" y="1231" class="cn tiny">当前缺口</text>
  <text x="1695" y="1231" text-anchor="end" class="cn tiny">图示状态依据：D-18 本轮交付说明｜未独立复验线上环境</text>
</svg>
