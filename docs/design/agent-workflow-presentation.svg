<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081528"/><stop offset=".55" stop-color="#102542"/><stop offset="1" stop-color="#1c1734"/>
    </linearGradient>
    <linearGradient id="guide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a91ef" stop-opacity=".42"/><stop offset="1" stop-color="#345bc3" stop-opacity=".22"/></linearGradient>
    <linearGradient id="director" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d58b62" stop-opacity=".42"/><stop offset="1" stop-color="#7f4f68" stop-opacity=".22"/></linearGradient>
    <linearGradient id="npc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a36fd0" stop-opacity=".42"/><stop offset="1" stop-color="#6056bd" stop-opacity=".22"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#8cbaff"/></marker>
    <marker id="arrowWarm" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#f0b477"/></marker>
    <style>
      .cn { font-family: PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif; }
      .title { font-size: 43px; font-weight: 700; fill:#f7f9ff; letter-spacing:1px; }
      .subtitle { font-size: 19px; fill:#b4c2d8; }
      .label { font-size: 14px; font-weight:700; fill:#8ebcff; letter-spacing:2px; }
      .cardTitle { font-size: 22px; font-weight:700; fill:#f7f9ff; }
      .cardText { font-size: 15px; fill:#d9e4f4; }
      .small { font-size: 13px; fill:#a8b8cf; }
      .tiny { font-size: 12px; fill:#92a6c2; }
      .pill { font-size: 13px; font-weight:700; }
      .flow { font-size: 16px; font-weight:700; fill:#e9f1ff; }
    </style>
  </defs>

  <rect width="1900" height="1280" fill="url(#bg)"/>
  <circle cx="1740" cy="140" r="260" fill="#5a76d6" opacity=".10"/>
  <circle cx="100" cy="1150" r="280" fill="#cc775f" opacity=".08"/>

  <text x="80" y="72" class="cn title">Agent 如何把“如果”演成一段人生</text>
  <text x="80" y="108" class="cn subtitle">用户的一句话，会经过不同 Agent 的接力，最后变成手机里的消息、关系与事件</text>
  <rect x="80" y="140" width="1740" height="68" rx="20" fill="#142843" stroke="#2f507d"/>
  <text x="112" y="182" class="cn flow">用户输入 → 理解你的意图 → 读取合适的资料 → 生成回应 → 记录这次选择 → 影响下一次相遇</text>

  <!-- left: reality -->
  <text x="80" y="260" class="cn label">A · 现实中的你</text>
  <rect x="80" y="282" width="420" height="700" rx="26" fill="#0d1c32" stroke="#2f507d" filter="url(#shadow)"/>
  <rect x="110" y="318" width="360" height="112" rx="18" fill="#172e50" stroke="#416da5"/>
  <text x="138" y="354" class="cn cardTitle">用户</text>
  <text x="138" y="382" class="cn cardText">“我最近总在想，</text>
  <text x="138" y="407" class="cn cardText">如果当时我选择拍电影呢？”</text>
  <text x="138" y="444" class="cn small">输入文字、照片或一句愿望</text>
  <path d="M290 430 V470" stroke="#8cbaff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="110" y="490" width="360" height="128" rx="18" fill="#132742" stroke="#416da5"/>
  <text x="138" y="526" class="cn cardTitle">我的资料</text>
  <text x="138" y="554" class="cn small">兴趣 · 经历 · 重要的人</text>
  <text x="138" y="580" class="cn small">愿望 · 选择 · 正在经历的事</text>
  <text x="138" y="605" class="cn tiny">只保存与用户有关、可追溯的内容</text>
  <path d="M290 618 V658" stroke="#8cbaff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="110" y="678" width="360" height="128" rx="18" fill="#132742" stroke="#416da5"/>
  <text x="138" y="714" class="cn cardTitle">分支记忆</text>
  <text x="138" y="742" class="cn small">“导演人生”里的选择</text>
  <text x="138" y="768" class="cn small">只影响这个世界，不改写现实档案</text>
  <text x="138" y="793" class="cn tiny">用户可以回看、修正或忘掉</text>
  <rect x="110" y="850" width="360" height="92" rx="18" fill="#101f37" stroke="#34577f"/>
  <text x="138" y="884" class="cn cardText">资料分成两层：</text>
  <text x="138" y="911" class="cn small">现实的你 / 某个世界里的你</text>

  <!-- conversation agent -->
  <text x="570" y="260" class="cn label">B · 对话 Agent</text>
  <rect x="570" y="282" width="440" height="700" rx="26" fill="url(#guide)" stroke="#548ed9" filter="url(#shadow)"/>
  <text x="608" y="340" class="cn cardTitle">个人向导 Agent</text>
  <text x="608" y="370" class="cn small">负责“认识你”，不是替你演完整个世界</text>
  <rect x="608" y="412" width="364" height="84" rx="16" fill="#09182e" opacity=".72"/>
  <text x="632" y="448" class="cn cardText">① 听懂你真正想探索什么</text>
  <text x="632" y="476" class="cn small">例如：遗憾、愿望、转折点</text>
  <rect x="608" y="516" width="364" height="84" rx="16" fill="#09182e" opacity=".72"/>
  <text x="632" y="552" class="cn cardText">② 提取有用的信息</text>
  <text x="632" y="580" class="cn small">写入“我的”与可追溯记忆</text>
  <rect x="608" y="620" width="364" height="84" rx="16" fill="#09182e" opacity=".72"/>
  <text x="632" y="656" class="cn cardText">③ 判断是否聊出了一个分支</text>
  <text x="632" y="684" class="cn small">用户说“我想试试”即可继续</text>
  <rect x="608" y="724" width="364" height="84" rx="16" fill="#09182e" opacity=".72"/>
  <text x="632" y="760" class="cn cardText">④ 生成几个与你有关的可能</text>
  <text x="632" y="788" class="cn small">也可以直接打开已有分支</text>
  <rect x="608" y="844" width="364" height="86" rx="16" fill="#0d203d" stroke="#5b94dc"/>
  <text x="632" y="879" class="cn cardText">对话结束后，资料仍然会跟着你</text>
  <text x="632" y="905" class="cn small">下一次聊天可以接着上一次继续</text>

  <!-- branch -->
  <text x="1080" y="260" class="cn label">C · 进入一个“如果”</text>
  <rect x="1080" y="282" width="330" height="700" rx="26" fill="#121b32" stroke="#75537e" filter="url(#shadow)"/>
  <text x="1118" y="340" class="cn cardTitle">如果：成为导演</text>
  <text x="1118" y="371" class="cn small">同一个你，新的起点</text>
  <rect x="1118" y="414" width="254" height="72" rx="16" fill="#2b2143" stroke="#9662a8"/>
  <text x="1142" y="445" class="cn cardText">身份：青年导演</text>
  <text x="1142" y="470" class="cn small">目标：拍出第一部作品</text>
  <rect x="1118" y="504" width="254" height="72" rx="16" fill="#2b2143" stroke="#9662a8"/>
  <text x="1142" y="535" class="cn cardText">重要的人：周岚</text>
  <text x="1142" y="560" class="cn small">关系：制片人 / 老朋友</text>
  <rect x="1118" y="594" width="254" height="72" rx="16" fill="#2b2143" stroke="#9662a8"/>
  <text x="1142" y="625" class="cn cardText">当前事件：明天开拍</text>
  <text x="1142" y="650" class="cn small">你的选择会改变后续</text>
  <path d="M1245 690 V738" stroke="#f0b477" stroke-width="2" marker-end="url(#arrowWarm)"/>
  <rect x="1118" y="758" width="254" height="116" rx="18" fill="#0b172b" stroke="#c28663"/>
  <text x="1142" y="793" class="cn cardText">点击进入</text>
  <text x="1142" y="826" class="cn cardTitle">平行世界手机</text>
  <text x="1142" y="853" class="cn small">锁屏上，可能已有新消息</text>

  <!-- world agents -->
  <text x="1480" y="260" class="cn label">D · 手机世界里的 Agent</text>
  <rect x="1480" y="282" width="340" height="700" rx="26" fill="#171733" stroke="#7458c4" filter="url(#shadow)"/>
  <rect x="1510" y="318" width="280" height="94" rx="18" fill="url(#director)" stroke="#c08361"/>
  <text x="1535" y="353" class="cn cardTitle">世界导演 Agent</text>
  <text x="1535" y="381" class="cn small">管理节奏、事件和谁会出现</text>
  <path d="M1650 412 V450" stroke="#f0b477" stroke-width="2" marker-end="url(#arrowWarm)"/>
  <rect x="1510" y="466" width="280" height="172" rx="18" fill="url(#npc)" stroke="#9275df"/>
  <text x="1535" y="502" class="cn cardTitle">NPC 角色 Agent</text>
  <text x="1535" y="532" class="cn small">每个重要角色有自己的</text>
  <text x="1535" y="557" class="cn small">性格、目标、关系和记忆</text>
  <line x1="1535" y1="580" x2="1762" y2="580" stroke="#b39be4" opacity=".4"/>
  <text x="1535" y="609" class="cn cardText">只代表自己，不替别人发言</text>
  <path d="M1650 638 V676" stroke="#8cbaff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1510" y="692" width="280" height="144" rx="18" fill="#101f37" stroke="#496f9f"/>
  <text x="1535" y="728" class="cn cardTitle">世界留下的后果</text>
  <text x="1535" y="758" class="cn small">一条消息 → 一场见面</text>
  <text x="1535" y="784" class="cn small">一个选择 → 一段关系变化</text>
  <text x="1535" y="810" class="cn small">一次经历 → 下一次对话的背景</text>
  <rect x="1510" y="868" width="280" height="74" rx="16" fill="#172c49" stroke="#3d6695"/>
  <text x="1535" y="902" class="cn cardText">这些结果会回到手机里</text>
  <text x="1535" y="927" class="cn small">消息、日历、相册、便签</text>

  <!-- arrows between major areas -->
  <path d="M505 628 H555" stroke="#8cbaff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="530" y="610" text-anchor="middle" class="cn tiny">理解</text>
  <path d="M1015 628 H1065" stroke="#f0b477" stroke-width="3" marker-end="url(#arrowWarm)"/>
  <text x="1040" y="610" text-anchor="middle" class="cn tiny">提出分支</text>
  <path d="M1415 628 H1465" stroke="#f0b477" stroke-width="3" marker-end="url(#arrowWarm)"/>
  <text x="1440" y="610" text-anchor="middle" class="cn tiny">进入世界</text>

  <!-- bottom loop -->
  <rect x="80" y="1030" width="1740" height="164" rx="24" fill="#0d1b30" stroke="#2f507d"/>
  <text x="112" y="1070" class="cn label">E · 一次输入之后，信息怎样继续流动</text>
  <text x="112" y="1110" class="cn flow">用户发消息</text>
  <path d="M235 1102 H315" stroke="#8cbaff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="1110" class="cn flow">导演判断场景</text>
  <path d="M500 1102 H580" stroke="#8cbaff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="1110" class="cn flow">对应 NPC 回应</text>
  <path d="M765 1102 H845" stroke="#8cbaff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="1110" class="cn flow">世界产生变化</text>
  <path d="M1030 1102 H1110" stroke="#8cbaff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1135" y="1110" class="cn flow">写入分支记忆</text>
  <path d="M1295 1102 H1375" stroke="#8cbaff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1400" y="1110" class="cn flow">影响下一次相遇</text>
  <text x="112" y="1158" class="cn small">现实资料与虚构世界分开保存：现实的你不会被剧情偷偷改写，但你在世界里的选择会被世界记住。</text>
  <text x="1710" y="1158" text-anchor="end" class="cn tiny">两个 Agent 层级：个人向导｜世界导演 + 多个 NPC</text>
</svg>
