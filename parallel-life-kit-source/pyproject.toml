[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-life-kit"
version = "0.1.0"
description = "Evidence-grounded parallel lives, bounded multi-agent worlds and character memory"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parallel_life = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
